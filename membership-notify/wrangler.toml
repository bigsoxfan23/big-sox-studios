name = "membership-notify"
main = "worker.mjs"
compatibility_date = "2026-09-29"
workers_dev = false
preview_urls = false
routes = []
# No routes, assets, service bindings, Mail Desk database, or HTTP actions.
[triggers]
crons = ["*/5 * * * *"]
[[d1_databases]]
binding = "MEMBERSHIP_DB"
database_name = "bss-membership-requests"
database_id = "21e13fa1-0ab3-4573-8d20-983c847ba0e9"
migrations_dir = "../membership/migrations"
[vars]
NOTIFY_ENABLED = "false"
NOTION_ENABLED = "false"
EMAIL_ENABLED = "false"
PROVIDER_VERIFIED_UNTIL_MS = "0"
NOTIFY_START_MS = "0"
PROVIDER_DAILY_LIMIT = "0" # Future verified shared-account allotment, max 10/day.
OWNER_EMAIL = "fridman.greg@gmail.com"
SENDER_EMAIL = "support@bigsoxstudios.com"
# Future secrets ONLY HERE: NOTION_API_TOKEN, RESEND_API_KEY.
# Independent future provider attestation: scope, verified sender, quota, $0 budget.
