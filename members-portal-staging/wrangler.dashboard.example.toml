# REVIEW EXAMPLE ONLY. Not an authorization to upload, deploy or migrate.
# Existing staging Worker; main remains the disabled Phase 1 entrypoint.
name = "big-sox-studios-members-staging"
main = "worker.mjs"
compatibility_date = "2026-10-09"
workers_dev = true
preview_urls = false
keep_vars = true
routes = [{ pattern = "members-staging.bigsoxstudios.com", custom_domain = true }]

[vars]
# Separate Owner Access application audience, never the members audience.
# Replace only from reviewed existing application metadata. No owner email here.
OWNER_ACCESS_AUDIENCE = "REPLACE_WITH_REVIEWED_OWNER_APP_AUDIENCE"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_EXISTING_APPROVED_PHASE2_DATABASE_NAME"
database_id = "REPLACE_WITH_EXISTING_APPROVED_PHASE2_DATABASE_UUID"
# Use the ALREADY-EXISTING dedicated Task12/Phase2 database, NOT Task11's
# bss-membership-requests / MEMBERSHIP_DB and NOT any other service database.
# No migrations_dir: this example does not create, bootstrap or migrate D1.
# Binding alone does not activate /app. A future source-reviewed entrypoint must
# select the Access/D1 assembly after reviewing the protected route and binding.
