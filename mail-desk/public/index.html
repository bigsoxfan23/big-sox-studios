<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Mail Desk</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body><header><img src="https://bigsoxstudios.com/brand/icons/app-icon-512.png" alt="Big Sox Studios" width="48" height="48"><div><span class="eyebrow">BIG SOX STUDIOS</span><h1>Mail desk</h1></div><span class="badge">Private · Owner only</span></header>
<div id="mode-notice" class="notice">Checking sending mode…</div>
<main id="maildesk-layout" data-view="inbox"><aside aria-label="Case queue"><div class="section-heading"><h2 id="folder-title">Inbox</h2><button id="refresh" type="button">Refresh</button></div><nav id="folders" aria-label="Mail folders"><button id="folder-inbox" type="button">Inbox</button><button id="folder-archive" type="button">Archive</button><button id="folder-trash" type="button">Trash</button></nav><p class="muted">Actions move the whole case. Trash is kept until restored. New email reopens Inbox.</p><label class="select-all"><input id="select-all" type="checkbox"> Select visible cases (up to 25)</label><div class="folder-actions" aria-label="Selected cases"><button id="bulk-archive" type="button">Archive selected</button><button id="bulk-trash" type="button">Trash selected</button><button id="bulk-restore" type="button">Restore selected</button></div><div id="queue"></div></aside>
<section id="detail" aria-label="Case details"><div class="empty"><h2>A little order for your inbox.</h2><p>Select a case to read the thread and prepare a reply.</p></div></section></main>
<p id="status" role="status" aria-live="polite"></p>
<template id="case-template"><button id="back-inbox" class="secondary" type="button">← Back to folder</button><div id="case-folder-actions" class="folder-actions"><button id="case-archive" type="button">Archive case</button><button id="case-trash" type="button">Trash case</button><button id="case-restore" type="button">Restore to Inbox</button></div><p id="case-folder" class="muted"></p><h2 id="subject"></h2><p id="identity" class="muted"></p><div id="thread"></div><h3>Reply</h3><label for="draft">Message</label><textarea id="draft" rows="8" maxlength="10000"></textarea><div class="actions"><button id="review" type="button">Review reply</button></div><section id="approval" hidden aria-label="Review reply"><h3>Review your reply</h3><p id="envelope"></p><pre id="preview"></pre><p id="review-note"></p><button id="send" type="button">Send reply</button><button id="cancel" type="button" class="secondary">Back to editing</button></section><h3>Delivery history</h3><div id="deliveries"></div></template>
</body></html>
