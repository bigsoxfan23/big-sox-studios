name: Integrate Batch 2.5 brand binaries
on:
  workflow_dispatch:
  push:
    branches: [batch-2-5-brand-assets]
    paths:
      - Big_Sox_Studios_Brand_Assets.zip
      - .github/workflows/batch-2-5-assets.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-2-5-brand-assets
      - name: Extract approved web assets
        run: |
          set -euo pipefail
          rm -rf /tmp/bss-assets
          mkdir -p /tmp/bss-assets public/brand/logo public/brand/mascot public/brand/icons public/brand/social
          unzip -q Big_Sox_Studios_Brand_Assets.zip -d /tmp/bss-assets
          root=/tmp/bss-assets/Big_Sox_Studios_Brand_Assets
          cp "$root"/web/logo/* public/brand/logo/
          cp "$root"/web/mascot/* public/brand/mascot/
          cp "$root"/icons/* public/brand/icons/
          cp "$root"/social/* public/brand/social/
          rm Big_Sox_Studios_Brand_Assets.zip
          rm .github/workflows/batch-2-5-assets.yml
      - name: Commit approved binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate approved Batch 2.5 brand assets"
          git push
