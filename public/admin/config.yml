# Big Sox Studios content editor
# OAuth base_url is added after the isolated Cloudflare authenticator is deployed.
backend:
  name: github
  repo: bigsoxfan23/big-sox-studios
  branch: main
  squash_merges: true

publish_mode: editorial_workflow

media_folder: public/media
public_folder: /media

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: false
    delete: false
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{status}}"
    fields:
      - { label: Project Name, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string, hint: "Changing this changes the project's public URL." }
      - { label: Category, name: category, widget: string }
      - { label: Status, name: status, widget: select, options: [Active, "In Progress", Complete, Experimental] }
      - { label: Card Summary, name: summary, widget: text }
      - label: Hero Image
        name: heroMedia
        widget: object
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alt Text, name: alt, widget: string }
      - label: Timeline
        name: timeline
        widget: list
        required: false
        fields:
          - { label: Milestone, name: label, widget: string }
          - { label: Date, name: date, widget: datetime, time_format: false }
      - label: Selected Updates
        name: updates
        widget: list
        required: false
        fields:
          - { label: Date, name: date, widget: datetime, time_format: false }
          - { label: Update, name: text, widget: text }
      - { label: Case Study, name: body, widget: markdown, hint: "Use the existing headings: The idea, What it does, Why it matters, What I learned." }

  - name: newsletter
    label: Newsletter
    label_singular: Newsletter Entry
    folder: src/content/newsletter
    create: true
    delete: false
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Published Date, name: publishedDate, widget: datetime, time_format: false }
      - label: Cover Image
        name: cover
        widget: object
        required: false
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alt Text, name: alt, widget: string }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Content, name: body, widget: markdown }

  # Austin Favorites is intentionally not exposed yet. Its existing Astro
  # collection remains ready for a later batch without building that feature here.
